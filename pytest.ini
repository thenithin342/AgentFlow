[pytest]
# Suppress known deprecation warnings that are not actionable yet.
# Scope to specific modules so we don't swallow deprecations from our own code.
filterwarnings =
    ignore::DeprecationWarning:langchain_community
    ignore::PendingDeprecationWarning:langchain
    ignore::PendingDeprecationWarning:langchain_community
    ignore::UserWarning:jwt
    # langchain-community emits its own import-time DeprecationWarning about the
    # sunset (backend/rag/ingest.py:34 is just where stacklevel points — the
    # message originates in langchain_community, which we do not control).
    # Filtered by exact message text only, so nothing else is swallowed.
    ignore:`langchain-community` is being sunset and is no longer actively maintained.*:DeprecationWarning
    # Pydantic v1 → v2 migration warnings from langchain_core tracer internals.
    # Not actionable until langchain_core ships a v2-native tracer.
    ignore::DeprecationWarning:pydantic
# Resource cleanup: the async SQLite connection opened by backend/main.py's
# lifespan is closed explicitly at shutdown (`await conn.close()`), and the
# sync graph is closed by tests/conftest.py `_clean_checkpoint_db`. No blanket
# ResourceWarning filter or `-p no:unraisableexception` suppression is needed
# anymore. Any third-party warning that legitimately remains should be filtered
# by its exact message + module only — do NOT restore a global ignore.
log_cli = false
log_level = ERROR
# Run async tests without an explicit @pytest.mark.asyncio per test.
# `asyncio_mode = auto` silences the pytest-asyncio deprecation warning
# ("asyncio_mode not set, defaulting to strict") and matches the project's
# async-everywhere test style (httpx.AsyncClient for API tests).
asyncio_mode = auto
# Pin test discovery to tests/ — otherwise pytest collects `*.py` from
# the repo root (debug_stream.py, inspect_db.py, verify_fixes.py) and
# emits confusing import errors. Limiting testpaths keeps `pytest`
# from the project root clean.
testpaths = tests
pythonpath = .
markers =
    eval: marks tests as live LangSmith evaluation runs (deselect with -m 'not eval')
    tier_a: deterministic Tier A regression tests — zero LLM/API calls, collected by default CI (-m 'not eval')
