name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    - name: Lint (ruff)
      run: ruff check backend/ tests/
    - name: Type check (mypy)
      run: mypy backend/ --ignore-missing-imports
    - name: Run tests + coverage
      # -m "not eval" excludes test_eval.py which spawns a background LangSmith
      # thread that lingers after the suite finishes, causing spurious 401 retry
      # noise and wall-clock slowdown when LANGCHAIN_API_KEY is absent in CI.
      # Coverage floor: actual total was ~51% (2026-09-12), floor set to 46
      # (actual minus 5) so the gate doesn't immediately fail; raise toward
      # 60%+ over time as tests improve.
      run: |
        pytest -v -m "not eval" --cov=backend --cov-report=xml --cov-report=term-missing --cov-fail-under=46
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        PYTHONPATH: .
    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        file: coverage.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Lint (eslint)
      run: npm run lint
    - name: Unit tests (vitest)
      run: npx vitest run --reporter=verbose
    - name: Production build
      run: npm run build

  # --------------------------------------------------------------------------
  # Render deploy fallback
  # --------------------------------------------------------------------------
  # Render only auto-deploys on push when the service is connected through the
  # Render GitHub App. A service created from a public repo URL must be
  # deployed manually every single time, and using "Deploy a specific commit"
  # (in the dashboard, or a hook call with ?ref=<sha>) silently disables
  # auto-deploys on that service.
  #
  # This job deploys after CI passes instead, so a green push to main always
  # goes live regardless of how the Render service was connected.
  #
  # It stays DORMANT until you add the service's Deploy Hook URL as the
  # repository secret RENDER_DEPLOY_HOOK_URL:
  #   Render Dashboard -> your service -> Settings -> Deploy Hook -> copy URL,
  #   then GitHub repo -> Settings -> Secrets and variables -> Actions ->
  #   New repository secret.
  #
  # Once native auto-deploys are confirmed working, delete that secret and this
  # job no-ops — which also prevents a double deploy per push.
  #
  # Never append ?ref=<sha> to the hook URL: deploying a specific commit
  # disables the service's auto-deploys.
  deploy:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - name: Trigger Render deploy (no-op when the hook secret is unset)
      env:
        RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      run: |
        if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
          echo "RENDER_DEPLOY_HOOK_URL is not set — skipping the Render deploy."
          echo "Add it as a repository secret to deploy from CI"
          echo "(Render Dashboard -> service -> Settings -> Deploy Hook)."
          exit 0
        fi
        curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" -o /dev/null
        echo "Render deploy triggered for ${GITHUB_SHA::7}."

