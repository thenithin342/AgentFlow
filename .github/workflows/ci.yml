name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    - name: Lint (ruff)
      run: ruff check backend/ tests/
    - name: Type check (mypy)
      run: mypy backend/ --ignore-missing-imports
    - name: Run tests + coverage
      # -m "not eval" excludes test_eval.py which spawns a background LangSmith
      # thread that lingers after the suite finishes, causing spurious 401 retry
      # noise and wall-clock slowdown when LANGCHAIN_API_KEY is absent in CI.
      # Coverage floor: actual total was ~51% (2026-09-12), floor set to 46
      # (actual minus 5) so the gate doesn't immediately fail; raise toward
      # 60%+ over time as tests improve.
      run: |
        pytest -v -m "not eval" --cov=backend --cov-report=xml --cov-report=term-missing --cov-fail-under=46
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        PYTHONPATH: .
    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        file: coverage.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
    - uses: actions/checkout@v7
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Lint (eslint)
      run: npm run lint
    - name: Unit tests (vitest)
      run: npx vitest run --reporter=verbose
    - name: Production build
      run: npm run build

